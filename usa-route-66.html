<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USA - Route 66</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --paper: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: #d2d2d7;
      --link: #0066cc;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% -20%, #ffffff 0, #f5f5f7 42%, #ececf0 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(980px, calc(100% - 40px));
      margin: 44px auto;
      padding: clamp(28px, 5vw, 72px);
      background: var(--paper);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    h1, h2, h3, h4, h5, h6 {
      line-height: 1.08;
      margin: 1.7em 0 0.55em;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      letter-spacing: 0;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 1.2rem;
      font-size: clamp(2.4rem, 7vw, 5rem);
      text-align: center;
    }

    p, ul, ol, blockquote, pre {
      margin: 0 0 1.15rem;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 2rem auto;
      border-radius: 18px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.12);
    }

    blockquote {
      padding: 0.35rem 0 0.35rem 1.25rem;
      color: var(--muted);
      border-left: 4px solid var(--border);
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.95em;
    }

    pre {
      overflow: auto;
      padding: 1.1rem;
      background: #f5f5f7;
      border-radius: 14px;
    }

    .attachment {
      display: inline-block;
      margin: 0.35rem 0;
      padding: 0.7rem 1rem;
      background: #f5f5f7;
      border-radius: 999px;
      font-weight: 600;
    }

    @media (max-width: 640px) {
      main {
        width: auto;
        margin: 0;
        padding: 24px 20px;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>USA - Route 66</h1>
    <p>https://ruta2023alfcat.blogspot.com/?m=0<br>http://alfredoycatiporelmundo.blogspot.com<br>https://www.travlerz.com/es/american-states-real-people-generated-ai?ly=native_one<br>https://youtu.be/oMf7ptOUpMg?feature=shared</p>
  </main>
</body>
</html>
